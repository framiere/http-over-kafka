name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./... && go vet -tags e2e ./e2e
      # Integration tests start their own Kafka with Testcontainers (Docker is
      # available on GitHub-hosted Ubuntu runners).
      - name: test
        run: go test ./... -count=1
