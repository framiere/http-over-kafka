name: images

# Container images for every binary on GitHub Container Registry, so the
# quickstart only needs Docker. Publishes with the built-in GITHUB_TOKEN.
on:
  push:
    branches: [main]
    paths: ["cmd/**", "internal/**", "api/**", "go.mod", "go.sum", "Dockerfile", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [gateway, bridge, deriver, audit, orders, payments, playground]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: CMD=${{ matrix.cmd }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sderosiaux/http-over-kafka/${{ matrix.cmd }}:latest
            ghcr.io/sderosiaux/http-over-kafka/${{ matrix.cmd }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cmd }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cmd }}
