name: e2e

# The end-to-end suite kills and freezes processes and the broker on purpose.
# It takes about 15 minutes, so it runs on demand and weekly, not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: start isolated broker
        run: docker compose -f e2e/compose.yaml up -d --wait
      - name: e2e
        run: go test -tags e2e ./e2e -count=1 -v -timeout 85m
      - name: keep process logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: e2e/out/
