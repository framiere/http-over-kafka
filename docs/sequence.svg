<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="800" viewBox="0 0 1560 800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 14px; fill: #475569; }
      .head { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .headsub { font-size: 12px; fill: #475569; }
      .msg { font-size: 13px; fill: #1e293b; }
      .msgmuted { font-size: 12px; fill: #64748b; font-style: italic; }
      .badge { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .badgetext { font-size: 12.5px; fill: #7c2d12; font-weight: 600; }
      .note { font-size: 12.5px; fill: #334155; }
      .notetitle { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .open { font-size: 12px; fill: #475569; }
    </style>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
    <marker id="resp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1560" height="800" fill="#ffffff"/>
  <text x="40" y="44" class="title">What happens between A and B on a POST</text>
  <text x="40" y="68" class="subtitle">Time flows down. The numbered badges are the moments that matter when something fails.</text>

  <!-- participants -->
  <g>
    <rect x="50" y="95" width="160" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="130" y="117" class="head" text-anchor="middle">Application A</text>
    <text x="130" y="134" class="headsub" text-anchor="middle">plain HTTP client</text>
    <rect x="290" y="95" width="160" height="50" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="370" y="117" class="head" text-anchor="middle">Gateway</text>
    <text x="370" y="134" class="headsub" text-anchor="middle">what A talks to</text>
    <rect x="530" y="95" width="160" height="50" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="610" y="117" class="head" text-anchor="middle">Kafka</text>
    <text x="610" y="134" class="headsub" text-anchor="middle">transport + log</text>
    <rect x="770" y="95" width="160" height="50" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="850" y="117" class="head" text-anchor="middle">Bridge</text>
    <text x="850" y="134" class="headsub" text-anchor="middle">consumer in front of B</text>
    <rect x="1010" y="95" width="160" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="1090" y="117" class="head" text-anchor="middle">Application B</text>
    <text x="1090" y="134" class="headsub" text-anchor="middle">plain HTTP service</text>
  </g>

  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="130" y1="145" x2="130" y2="740"/>
    <line x1="370" y1="145" x2="370" y2="740"/>
    <line x1="610" y1="145" x2="610" y2="740"/>
    <line x1="850" y1="145" x2="850" y2="740"/>
    <line x1="1090" y1="145" x2="1090" y2="740"/>
  </g>

  <!-- A's open connection -->
  <rect x="124" y="180" width="12" height="490" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="112" y="430" class="open" text-anchor="middle" transform="rotate(-90 112 430)">connection open: synchronous for A</text>
  <!-- B busy -->
  <rect x="1084" y="455" width="12" height="50" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>

  <!-- 1 -->
  <line x1="136" y1="185" x2="366" y2="185" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#req)"/>
  <text x="250" y="177" class="msg" text-anchor="middle">POST /charges</text>
  <text x="250" y="202" class="msgmuted" text-anchor="middle">JWT + Idempotency-Key</text>
  <!-- gateway work -->
  <rect x="378" y="214" width="215" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="388" y="232" class="msgmuted">auth, route via OpenAPI,</text>
  <text x="388" y="249" class="msgmuted">strip secrets, sign command</text>
  <!-- 2 produce -->
  <line x1="370" y1="285" x2="606" y2="285" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#req)"/>
  <text x="490" y="277" class="msg" text-anchor="middle">produce command (acks=all)</text>
  <line x1="610" y1="305" x2="374" y2="305" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ack)"/>
  <text x="490" y="321" class="msgmuted" text-anchor="middle">ack</text>
  <circle cx="635" cy="285" r="11" fill="#ea580c"/><text x="635" y="289" class="badge" text-anchor="middle">1</text>
  <text x="652" y="289" class="badgetext">command durable</text>
  <!-- 3 consume -->
  <line x1="610" y1="345" x2="846" y2="345" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#req)"/>
  <text x="728" y="337" class="msg" text-anchor="middle">consume, verify signature</text>
  <!-- 4 TX1 -->
  <line x1="850" y1="385" x2="614" y2="385" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#req)"/>
  <text x="728" y="377" class="msg" text-anchor="middle">TX 1: "started"</text>
  <circle cx="635" cy="405" r="11" fill="#ea580c"/><text x="635" y="409" class="badge" text-anchor="middle">2</text>
  <text x="652" y="409" class="badgetext">B may be called now</text>
  <!-- 5 call B -->
  <line x1="850" y1="455" x2="1084" y2="455" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#req)"/>
  <text x="968" y="447" class="msg" text-anchor="middle">POST /charges</text>
  <text x="968" y="472" class="msgmuted" text-anchor="middle">plain HTTP, X-Caller-*</text>
  <!-- 6 B answers -->
  <line x1="1084" y1="505" x2="854" y2="505" stroke="#059669" stroke-width="2.2" marker-end="url(#resp)"/>
  <text x="968" y="497" class="msg" text-anchor="middle">201 + body</text>
  <circle cx="1115" cy="480" r="11" fill="#ea580c"/><text x="1115" y="484" class="badge" text-anchor="middle">3</text>
  <text x="1132" y="484" class="badgetext">side effect done in B</text>
  <!-- 7 TX2 -->
  <line x1="850" y1="555" x2="614" y2="555" stroke="#059669" stroke-width="2.2" marker-end="url(#resp)"/>
  <text x="728" y="547" class="msg" text-anchor="middle">TX 2, atomic</text>
  <text x="728" y="572" class="msgmuted" text-anchor="middle">response + result + state + offset</text>
  <circle cx="635" cy="590" r="11" fill="#ea580c"/><text x="635" y="594" class="badge" text-anchor="middle">4</text>
  <text x="652" y="594" class="badgetext">outcome durable</text>
  <!-- 8 response to gateway -->
  <line x1="610" y1="625" x2="374" y2="625" stroke="#059669" stroke-width="2.2" marker-end="url(#resp)"/>
  <text x="490" y="617" class="msg" text-anchor="middle">response (read_committed)</text>
  <!-- 9 response to A -->
  <line x1="370" y1="665" x2="136" y2="665" stroke="#059669" stroke-width="2.2" marker-end="url(#resp)"/>
  <text x="250" y="657" class="msg" text-anchor="middle">201, B's bytes unchanged</text>
  <circle cx="155" cy="690" r="11" fill="#ea580c"/><text x="155" y="694" class="badge" text-anchor="middle">5</text>
  <text x="172" y="694" class="badgetext">A has B's real answer</text>

  <!-- failure notes -->
  <rect x="1260" y="170" width="270" height="140" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1275" y="194" class="notetitle">Bridge dies between 2 and 4</text>
  <text x="1275" y="216" class="note">B may have run. The next bridge</text>
  <text x="1275" y="234" class="note">finds "started" without an outcome:</text>
  <text x="1275" y="252" class="note">A gets 502 outcome_unknown, and B</text>
  <text x="1275" y="270" class="note">is never called again for this</text>
  <text x="1275" y="288" class="note">request. No silent double debit.</text>

  <rect x="1260" y="330" width="270" height="140" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="1275" y="354" class="notetitle">Gateway deadline passes first</text>
  <text x="1275" y="376" class="note">A gets 504 with the requestId. The</text>
  <text x="1275" y="394" class="note">command keeps running. A retry with</text>
  <text x="1275" y="412" class="note">the same Idempotency-Key gets the</text>
  <text x="1275" y="430" class="note">original answer, marked</text>
  <text x="1275" y="448" class="note">Idempotent-Replayed. B runs once.</text>

  <rect x="1260" y="490" width="270" height="122" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="1275" y="514" class="notetitle">After 4, for free</text>
  <text x="1275" y="536" class="note">The Result is in Kafka. The deriver</text>
  <text x="1275" y="554" class="note">turns it into a business event if</text>
  <text x="1275" y="572" class="note">B's OpenAPI declares one; audit and</text>
  <text x="1275" y="590" class="note">any other consumer can read it.</text>

  <text x="40" y="772" class="note">PUT, DELETE and operations marked x-conduktor-retry-safe skip TX 1: re-running them is safe, so a crash just replays the call.</text>
</svg>
