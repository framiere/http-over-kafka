# http-over-kafka quickstart. Only needs Docker:
#
#   curl -fsSL https://sderosiaux.github.io/http-over-kafka/quickstart.yml | docker compose -f - up -d --wait
#
#   http://localhost:8080   the gateway: call it like any HTTP service (Host: orders)
#   http://localhost:8090   the playground: send requests, watch Kafka record them
#   http://localhost:8088   Conduktor Console: browse the topics (admin@example.com / Admin_1234!)
#
# Stop and clean up: docker compose -p http-over-kafka-quickstart down -v
#
# Every key below is an INSECURE development key, public on purpose so this file
# runs as is. Never use them outside a laptop.
name: http-over-kafka-quickstart

x-keys:
  idp: &idp
    HOK_JWT_ISSUER: dev-idp
    HOK_JWT_AUDIENCE: http-over-kafka
  trusted: &trusted
    HOK_TRUSTED_GATEWAY_KEYS: "dev-insecure-gateway-1:agXzz5jTSSowAwheM7Cxk5BR+/vWv6ho670TUHVuFtY="
    HOK_TRUSTED_BRIDGE_KEYS: "dev-insecure-bridge-1:4AIplwBU1mK7EaiFf7HU+cpSfrzR8LhkOMW8HJfQJzc="

services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 2s
      timeout: 10s
      retries: 30

  # Two ordinary HTTP services. They know nothing about Kafka.
  orders:
    image: ghcr.io/sderosiaux/http-over-kafka/orders:latest
    ports: ["8081:8081"]
    environment: { ADDR: ":8081" }

  payments:
    image: ghcr.io/sderosiaux/http-over-kafka/payments:latest
    ports: ["8082:8082"]
    environment: { ADDR: ":8082" }

  gateway:
    image: ghcr.io/sderosiaux/http-over-kafka/gateway:latest
    depends_on: { kafka: { condition: service_healthy } }
    restart: on-failure
    ports: ["8080:8080", "9080:9080"]
    environment:
      <<: [*idp, *trusted]
      KAFKA_BROKERS: kafka:29092
      HOK_GATEWAY_INSTANCE: gateway-1
      HOK_SERVICES: orders=http://orders:8081,payments=http://payments:8082
      HOK_GATEWAY_SIGNING_KEY: "dev-insecure-gateway-1:eEyFk70mUIfrGf7GSJ63GDL/wAMGXeZUGgFBWeqUOxE="
      HOK_JWT_KEYS: "dev-insecure-idp-1:owzn7BLYNHbVLCuqHk4elGSQ0sF/csq87feytQzkN0E="

  bridge-orders:
    image: ghcr.io/sderosiaux/http-over-kafka/bridge:latest
    depends_on: { kafka: { condition: service_healthy } }
    restart: on-failure
    environment: &bridge
      <<: *trusted
      KAFKA_BROKERS: kafka:29092
      HOK_BRIDGE_SIGNING_KEY: "dev-insecure-bridge-1:GnApwkOEAxgPrpX1b1Cfk+Weep9BOWOK9SdbMo3i7Lo="
      HOK_SERVICE: orders
      HOK_UPSTREAM: http://orders:8081

  bridge-payments:
    image: ghcr.io/sderosiaux/http-over-kafka/bridge:latest
    depends_on: { kafka: { condition: service_healthy } }
    restart: on-failure
    environment:
      <<: *bridge
      HOK_SERVICE: payments
      HOK_UPSTREAM: http://payments:8082

  deriver-orders:
    image: ghcr.io/sderosiaux/http-over-kafka/deriver:latest
    depends_on: { kafka: { condition: service_healthy } }
    restart: on-failure
    environment:
      <<: *trusted
      KAFKA_BROKERS: kafka:29092
      HOK_SERVICE: orders
      HOK_DERIVER_INSTANCE: deriver-orders-1

  playground:
    image: ghcr.io/sderosiaux/http-over-kafka/playground:latest
    depends_on:
      kafka: { condition: service_healthy }
      gateway: { condition: service_started }
    restart: on-failure
    # Bound to localhost: it mints dev tokens for whoever reaches it.
    ports: ["127.0.0.1:8090:8090"]
    environment:
      <<: [*idp, *trusted]
      KAFKA_BROKERS: kafka:29092
      HOK_DEV_IDP_KEY: "dev-insecure-idp-1:9YAzKIuHIS8BFk2L+8VRH+gilBZGeHgOmhzrtYmdTq4="
      HOK_PLAYGROUND_GATEWAY: http://gateway:8080
      HOK_PLAYGROUND_GATEWAY_ADMIN: http://gateway:9080
      HOK_PLAYGROUND_PUBLIC_GATEWAY: http://localhost:8080

  console-db:
    image: postgres:17
    environment:
      POSTGRES_DB: console
      POSTGRES_USER: console
      POSTGRES_PASSWORD: console
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console"]
      interval: 2s
      timeout: 5s
      retries: 30

  console:
    image: conduktor/conduktor-console:1.47.2
    depends_on:
      console-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8088:8080"]
    environment:
      CDK_DATABASE_URL: postgresql://console:console@console-db:5432/console
      CDK_ORGANIZATION_NAME: http-over-kafka
      CDK_ADMIN_EMAIL: admin@example.com
      CDK_ADMIN_PASSWORD: Admin_1234!
      CDK_CLUSTERS_0_ID: local
      CDK_CLUSTERS_0_NAME: http-over-kafka
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      CDK_CLUSTERS_0_COLOR: "#4F46E5"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
